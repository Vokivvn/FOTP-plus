 commission.60.t:0 "The Coup in Banat"
 commission.60.desc:0 "The compromise reached to create the state of Banat has been undone. The army and members of the All-German Association have seized control of the still young state, sparking international concern. The great powers fear that the days of peace are over, and conflict is on the horizon. It has become increasingly clear that the Second Commission was merely a pretext for Austria to regain influence and further destabilize its former crown lands. Already, nations have decried the coup as the “strangling” of European democracy and say it was done by the callous hands of Austria.\n\nThe Leader of this Coup, Josef "Sepp" Janko, was a rather unremarkable figure. A leader of a party seemingly from nowhere with weapons and money, and the most baffling factor, a large sway over the military. It was because of this that he was able to sweep into the parliament building, arrest Viktor Orendi-Hommenau, and declare the Banatian State. To Hungarians, Serbs, and many other Slavs, fear is the only thing they know anymore."
 commission.60.a:0 "A tumultuous time indeed"