 commission.60.t:0 "The Coup in Banat"
 commission.60.desc:0 "The compromise reached to create the state of Banat has been undone. The army and members of the All-German Association have seized control of the still young state, sparking international concern. The great powers fear that the days of peace are over, and conflict is on the horizon. It has become increasingly clear that the Second Commission was merely a pretext for Austria to regain influence and further destabilize its former crown lands. Already, nations have decried the coup as the “strangling” of European democracy and say it was done by the callous hands of Austria.\n\nThe Leader of this Coup, Josef "Sepp" Janko, is a rather unremarkable figure. The party seemingly came from nowhere, yet features a plethora of weapons and funding, which enables an upper hand over the military. Because of this, he was able to sweep through the parliament building, arrest Viktor Orendi-Hommenau, and declare the Banatian State. To Hungarians, Serbs, and many other Slavs, fear is the only thing they know anymore."
 commission.60.a:0 "A tumultuous time indeed"